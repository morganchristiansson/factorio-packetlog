# ─────────────────────────────────────────────────────────────
# Hivemind AI agent config
# ─────────────────────────────────────────────────────────────
# Copy to config-hivemind.yaml and edit. The agent auto-enables
# in server mode when an API key is set (HIVE_API_KEY env var).
# API key, model override, and endpoint override are env-only
# (secrets / per-run), respectively: HIVE_API_KEY, HIVE_MODEL,
# HIVE_API_BASE — these take precedence over values here.
# ─────────────────────────────────────────────────────────────

# OpenAI-compatible endpoint (default shown). Env override:
# HIVE_API_BASE (takes precedence).
api_base: "https://opencode.ai/zen/go/v1"

# Model name (default shown). Env override: HIVE_MODEL takes
# precedence.
model: "deepseek-v4-flash"

# Provider. Hardcoded (:openai) — no knob.
provider: openai

# Max UNREAD console lines kept between prompts (1000 ≈ 40k tokens).
history_size: 1000

# Per-line clip in the history context.
history_line_len: 120

# Truncate replies to fit Factorio chat's ~500 char limit.
max_reply_len: 400

# Recent-context budget (characters) kept after compaction.
trim_tail_chars: 20000

# Auto-compaction gate: distill only when the session holds at
# least this many characters of conversation (TRIM_TAIL_CHARS * 20).
auto_compaction_min_chars: 400000

# Chat trigger phrases (case-insensitive, whole-word match).
triggers:
  - hivemind
  - good bot
  - goodbot
  - hm
  - hive

# Game-log watcher: log() event names that additionally fire a
# dedicated turn (followed by auto-compaction).
log_turn_events:
  - map-reset
