# ─────────────────────────────────────────────────────────────
# Translation agent config
# ─────────────────────────────────────────────────────────────
# Copy to config-translation.yaml and edit. The translation
# agent auto-enables in server mode when RCON is available
# (no API key needed for the default argos backend).
# API keys for backends are env-only:
#   GOOGLE_TRANSLATE_API_KEY (hybrid/google backend)
# ─────────────────────────────────────────────────────────────

# Enable auto-translation of foreign player chat (server mode,
# RCON available).
enabled: true

# Translation backend. One of: libretranslate, bergamot, argos,
# google, hybrid, mock. Default: argos (installed on server).
backend: argos

# Locales to translate between. 'en' is always the pivot
# (translation target) — English speakers get relayed to other
# whitelisted readers. Translation occurs between all listed
# locales when players using them are online.
whitelist:
  - en
  - pt
  - ru

# Backend URLs (defaults shown; override per run via the
# backend-specific option or environment).
libretranslate_url: "https://libretranslate.de/translate"
bergamot_url: "http://localhost:8080"
