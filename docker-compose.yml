services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: factorio-packetlog-dev
    environment:
      TERM:
      COLORTERM:
    # Mount the repo read-only (source is managed on the host or via the agent)
    volumes:
      - .:/workspace
      # - ./.git:/workspace/.git:ro
      - /home/morgan/factorio/data:/factorio-data:ro
      - s25client-home:/home/ubuntu
    working_dir: /workspace
volumes:
  s25client-home:
