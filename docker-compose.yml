services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: factorio-packetlog-dev
    environment:
      TERM:
      COLORTERM:
    # Mount the repo read-only (source is managed on the host or via the agent)
    volumes:
      - .:/workspace
      # - ./.git:/workspace/.git:ro
      - /home/morgan/factorio:/factorio:ro
      - /home/morgan/work/factorio-legendary-deathworld:/factorio-legendary-deathworld
      - s25client-home:/home/ubuntu
    networks:
      - devnet
    working_dir: /workspace
volumes:
  s25client-home:
networks:
  devnet:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd12:3456:789a::/64
